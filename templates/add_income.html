<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Income - Expense Tracker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav>
        <h2>Expense Tracker</h2>
        <ul>
            <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
            <li><a href="{{ url_for('transaction_history') }}">History</a></li>
            <li><a href="{{ url_for('reports') }}">Reports</a></li>
            <li><a href="{{ url_for('logout') }}">Logout</a></li>
        </ul>
    </nav>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash-msg">{{ messages[0] }}</div>
        {% endif %}
    {% endwith %}

    <div class="form-page">

        <div class="expense-container income-mode">

            <div class="form-icon-header">💰</div>

            <h1>Add Income</h1>
            <p class="form-subtext">Record money coming in</p>

            <form method="POST">

                <label>Income Source</label>
                <input type="text"
                       id="source"
                       name="source"
                       placeholder="e.g. Salary, Freelance, Bonus"
                       required>

                <div class="chip-row">
                    <span class="chip" data-target="source">Salary</span>
                    <span class="chip" data-target="source">Freelance</span>
                    <span class="chip" data-target="source">Business</span>
                    <span class="chip" data-target="source">Rental Income</span>
                    <span class="chip" data-target="source">Bonus</span>
                </div>

                <label>Amount (₹)</label>
                <input type="number"
                       name="amount"
                       min="0.01"
                       step="0.01"
                       placeholder="0.00"
                       required>

                <button type="submit" class="primary-btn">
                    Add Income
                </button>

            </form>

            <a href="/dashboard" class="back-btn">
                ← Back to Dashboard
            </a>

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
