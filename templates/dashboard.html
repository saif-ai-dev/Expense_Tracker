<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Expense Tracker</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="login-container">

        <h2>Welcome 👋</h2>

        <p>Successfully Logged In</p>

        <br>

        <h3>Total Income</h3>
        <h2>₹{{ total_income }}</h2>

        <br>

        <h3>Total Expenses</h3>
        <h2>₹{{ total_expense }}</h2>

        <br>

        <h3>Current Balance</h3>
        <h2>₹{{ balance }}</h2>

        <br>

        <a href="/add_income" class="dashboard-btn">
            💰 Add Income
        </a>

        <br><br>

        <a href="/add_expense" class="dashboard-btn">
            💸 Add Expense
        </a>

        <br><br>

        <a href="/transaction_history" class="dashboard-btn">
           📜 Transaction History
        </a>
            

        <br><br>

        <a href="/" class="dashboard-btn">
            🚪 Logout
        </a>

    </div>

</body>

</html>
